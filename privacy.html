<style>
:root{--gold:#f0b429;--dark:#0a0e1a;--dark2:#111827;--card:#161e30;--border:#2a3552;--text:#e8eaf0;--muted:#7888a8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--dark);color:var(--text);font-family:'Noto Sans JP',sans-serif;line-height:1.8;}
.hero{background:linear-gradient(135deg,#0a0e1a,#1a2540);padding:28px 20px 18px;text-align:center;border-bottom:2px solid var(--gold);}
.hero-badge{display:inline-block;background:var(--gold);color:#0a0e1a;font-size:10px;font-weight:900;letter-spacing:3px;padding:3px 12px;border-radius:2px;margin-bottom:10px;}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:3px;color:#fff;}
.hero p{color:var(--muted);font-size:12px;margin-top:4px;}
.nav{background:var(--dark2);border-bottom:1px solid var(--border);padding:10px 20px;text-align:center;}
.nav a{color:var(--gold);text-decoration:none;font-size:12px;font-weight:700;margin:0 12px;}
.nav a:hover{text-decoration:underline;}
.content{max-width:760px;margin:0 auto;padding:40px 20px 80px;}
h2{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--gold);margin:32px 0 10px;border-bottom:1px solid var(--border);padding-bottom:6px;}
p{color:var(--muted);font-size:14px;margin-bottom:14px;}
ul{color:var(--muted);font-size:14px;padding-left:20px;margin-bottom:14px;}
ul li{margin-bottom:6px;}
a{color:var(--gold);}
.updated{font-size:11px;color:var(--muted);margin-bottom:30px;}
footer{text-align:center;padding:20px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);}

/* ── LANG SWITCHER ── */
.lang-btn{position:fixed;top:12px;right:12px;z-index:500;background:var(--dark3);border:1px solid var(--border);border-radius:20px;padding:5px 10px;cursor:pointer;font-size:16px;display:flex;align-items:center;gap:4px;color:var(--text);transition:border-color 0.2s;}
.lang-btn:hover{border-color:var(--gold);}
.lang-dropdown{position:fixed;top:44px;right:12px;z-index:501;background:var(--dark2);border:1px solid var(--border);border-radius:8px;overflow:hidden;display:none;box-shadow:0 4px 16px rgba(0,0,0,0.5);}
.lang-dropdown.open{display:block;}
.lang-opt{display:block;padding:10px 18px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.lang-opt:hover{background:var(--dark3);color:var(--gold);}
.lang-opt.active{color:var(--gold);}
</style>
</head>
<body>
<div class="lang-btn" onclick="toggleLangMenu()" id="lang-btn">🌐</div>
<div class="lang-dropdown" id="lang-dropdown">
  <div class="lang-opt" onclick="setLang('en')" id="lang-opt-en">🇺🇸 English</div>
  <div class="lang-opt" onclick="setLang('ja')" id="lang-opt-ja">🇯🇵 日本語</div>
</div>

  ja:{

let lang=localStorage.getItem('sp_lang')||'ja';
function toggleLangMenu(){document.getElementById('lang-dropdown').classList.toggle('open');}
document.addEventListener('click',function(e){
  const btn=document.getElementById('lang-btn'),dd=document.getElementById('lang-dropdown');
  if(btn&&dd&&!btn.contains(e.target)&&!dd.contains(e.target))dd.classList.remove('open');
});
function setLang(l){
  lang=l;localStorage.setItem('sp_lang',l);
  document.getElementById('lang-opt-en').className='lang-opt'+(l==='en'?' active':'');
  document.getElementById('lang-opt-ja').className='lang-opt'+(l==='ja'?' active':'');
  document.getElementById('lang-dropdown').classList.remove('open');
  renderPrivacy();
}
function renderPrivacy(){
  const L=PRIV_I18N[lang];
  document.querySelector('.hero-badge').textContent=L.badge;
  document.querySelector('.hero h1').innerHTML=L.title;
  document.querySelector('.hero p').textContent=L.sub;
  const u=document.getElementById('lbl-updated');if(u)u.textContent=L.updated;
  const b=document.getElementById('priv-body');if(b)b.innerHTML=L.body;
  const ft=document.getElementById('lbl-footer');if(ft)ft.textContent=L.footer;
  const navLinks=document.querySelectorAll('nav a');
  if(navLinks[0])navLinks[0].textContent=L.nav.about;
  if(navLinks[1])navLinks[1].textContent=L.nav.contact;
  if(navLinks[2])navLinks[2].textContent=L.nav.privacy;
  document.getElementById('lang-opt-en').className='lang-opt'+(lang==='en'?' active':'');
  document.getElementById('lang-opt-ja').className='lang-opt'+(lang==='ja'?' active':'');
}
renderPrivacy();
</script>
</body>
</html>
