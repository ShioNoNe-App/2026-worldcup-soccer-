<!doctype html>
<html lang="ja" data-style="pop">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8ee" />
    <meta name="description" content="四柱推命を入口に、答えるほど自分が見えてくる占い・自己理解サービス" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
    <title>じぶんめくり</title>
    <script>
      // 保存済みのスタイルを描画前に反映して、ちらつきを防ぐ
      try {
        var s = JSON.parse(localStorage.getItem('jibun-mekuri:v1') || 'null');
        if (s && ['pop', 'chic', 'game', 'fairy'].indexOf(s.style) >= 0) document.documentElement.dataset.style = s.style;
        if (s && s.motion === 'reduce') document.documentElement.dataset.motion = 'reduce';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
